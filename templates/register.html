<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 陈平安资料库</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=24">
    <style>
        .login-ink-left {
            position: absolute;
            left: 5%;
            top: 10%;
            width: 280px;
            height: 500px;
            background: radial-gradient(ellipse at 30% 40%, rgba(0,0,0,0.04) 0%, transparent 60%);
            pointer-events: none;
        }
        .login-ink-right {
            position: absolute;
            right: 8%;
            bottom: 15%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(139,0,0,0.03) 0%, transparent 60%);
            pointer-events: none;
        }
        .login-divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            gap: 12px;
        }
        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--border), transparent);
        }
        .login-divider span {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 4px;
        }
        .login-box h1 {
            position: relative;
            padding-bottom: 12px;
        }
        .login-box h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 2px;
            background: var(--cinnabar);
            opacity: 0.6;
        }
        .login-box .form-group input {
            border: none;
            border-bottom: 1px solid var(--border);
            background: transparent;
            border-radius: 0;
            padding: 10px 4px;
            letter-spacing: 2px;
        }
        .login-box .form-group input:focus {
            border-bottom-color: var(--cinnabar);
            background: transparent;
            box-shadow: none;
        }
        .login-box .form-group label {
            letter-spacing: 4px;
            font-size: 13px;
        }
        .login-poem {
            text-align: center;
            font-size: 11px;
            color: var(--ink-faint);
            margin-top: 16px;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                    <div class="flash-message {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <div class="login-container">
        <div class="login-ink-left"></div>
        <div class="login-ink-right"></div>
        <div class="login-box ink-corner" style="position:relative;width:440px;">
            <h1>用户注册</h1>
            <p class="subtitle">创建账号开始使用</p>
            
            <div class="login-divider"><span>注 册</span></div>
            
            <form method="POST" action="{{ url_for('register') }}">
                <div class="form-group">
                    <label>用户名 *</label>
                    <input type="text" name="username" required placeholder="至少3位" minlength="3">
                </div>
                <div class="form-group">
                    <label>密 码 *</label>
                    <input type="password" name="password" required placeholder="至少4位" minlength="4">
                </div>
                <div class="form-grid cols-2">
                    <div class="form-group">
                        <label>真实姓名</label>
                        <input type="text" name="real_name" placeholder="请输入姓名">
                    </div>
                    <div class="form-group">
                        <label>手机号</label>
                        <input type="text" name="phone" placeholder="请输入手机号">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top:8px;">注 册</button>
            </form>
            
            <div class="login-footer">
                已有账号？<a href="{{ url_for('login') }}">立即登录</a>
            </div>
            <div class="login-poem">—— 绝知此事要躬行 ——</div>
        </div>
    </div>

    <script>
        setTimeout(() => {
            const msgs = document.querySelectorAll('.flash-message');
            msgs.forEach(m => m.style.opacity = '0');
            setTimeout(() => msgs.forEach(m => m.remove()), 300);
        }, 3000);
    </script>
</body>
</html>
